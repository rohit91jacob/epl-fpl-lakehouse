name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  AIRFLOW_VERSION: "3.3.2"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Unit & Spark tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Cache Delta jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - run: uv sync --locked
      - run: uv run pytest -m "not airflow" --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  airflow:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Airflow with official constraints
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install --no-deps -e .
      - name: DAG tests
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          airflow db migrate
          pytest tests/test_dags.py -m airflow -p no:cacheprovider

  docker:
    name: Pipeline image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: epl-fpl-lakehouse:ci
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,mode=max,scope=pipeline
      - name: Full pipeline on synthetic data, inside the container
        run: |
          docker run --rm --entrypoint bash epl-fpl-lakehouse:ci -c '
            set -euo pipefail
            epl sample-data --out /tmp/api
            export EPL_FPL_BASE_URL=file:///tmp/api EPL_LOG_FORMAT=text
            epl run --run-id ci-smoke
            epl show gold.mart_league_table --where "as_of_gameweek = 5" --order-by position --limit 5
          '

  compose-e2e:
    name: Airflow compose end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Point the stack at synthetic data
        run: echo "EPL_FPL_BASE_URL=file:///opt/airflow/lake/sample-api" > .env
      - name: Start Airflow
        run: >
          docker compose up -d --build --wait --wait-timeout 900
          airflow-apiserver airflow-scheduler airflow-dag-processor
      - name: Run the daily DAG
        run: |
          docker compose exec -T airflow-scheduler epl sample-data --out /opt/airflow/lake/sample-api
          docker compose exec -T airflow-scheduler airflow dags test epl_fpl_daily 2026-09-14
      - name: Verify the lake from inside the stack
        run: |
          docker compose exec -T -e EPL_LOG_FORMAT=text airflow-scheduler epl quality --layer all --run-id compose-verify
          docker compose exec -T -e EPL_LOG_FORMAT=text airflow-scheduler \
            epl show gold.mart_league_table --where "as_of_gameweek = 5" --order-by position --limit 5
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 300
      - name: Tear down
        if: always()
        run: docker compose down -v
