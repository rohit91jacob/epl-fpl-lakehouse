name: Refresh

# Daily: fetch the latest FPL data, update the lake incrementally, publish the results site.
on:
  schedule:
    - cron: "30 6 * * *" # after FPL confirms bonus points overnight
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Refetch everything and rebuild the lake from scratch
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  refresh:
    name: Update lake and build site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EPL_DATA_ROOT: ${{ github.workspace }}/lake
      EPL_LOG_FORMAT: text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Cache Delta jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2.5.2
          key: ivy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      # The lake (raw zone, Delta tables, incremental state) persists between runs in the
      # Actions cache. If it was evicted, this run rebuilds it from the API.
      - name: Restore the lake
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: lake
          key: epl-lake-${{ github.run_id }}
          restore-keys: epl-lake-
      - name: Report lake state
        run: |
          echo "restored from: ${{ steps.restore.outputs.cache-matched-key || 'nothing (fresh lake)' }}"
          du -sh lake 2>/dev/null || true
      - run: uv sync --locked
      - name: Run the pipeline
        run: >
          uv run epl run --run-id "refresh_${{ github.run_id }}_${{ github.run_attempt }}"
          ${{ inputs.full_refresh && '--full-refresh' || '' }}
      - name: Weekly Delta maintenance (Mondays)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ]; then uv run epl maintenance; else echo "not Monday, skipped"; fi
      - name: Save the lake
        uses: actions/cache/save@v4
        with:
          path: lake
          key: epl-lake-${{ github.run_id }}
      - name: Build the results site
        run: uv run epl report --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    name: Open an issue on failure
    needs: [refresh, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Scheduled refresh is failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The daily refresh failed: ${run}\n\nSee docs/runbook.md ("Scheduled refresh failed"). ` +
              `This issue is reused for later failures; close it once a run is green.`;
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open" });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Failed again: ${run}` });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
