version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # Spark and Delta move together; bump them by hand after checking compatibility.
      - dependency-name: pyspark
      - dependency-name: delta-spark
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/", "/docker/airflow"]
    schedule:
      interval: weekly
    ignore:
      # Python 3.13+ base images: the pinned libraries are not on 3.13+ yet; take 3.12 patches only
      - dependency-name: python
        versions: [">=3.13"]
