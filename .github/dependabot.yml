version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # Spark and Delta move together; bump them by hand after checking compatibility.
      - dependency-name: pyspark
      - dependency-name: delta-spark
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/", "/docker/airflow"]
    schedule:
      interval: weekly
